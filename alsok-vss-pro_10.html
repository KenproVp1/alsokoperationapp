<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALSOK VSS — CRM Vận hành Bảo vệ PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#1a2f5e;--sb2:#223a72;--sb-act:rgba(59,130,246,.18);--sb-border:#3b82f6;
  --sb-t:rgba(255,255,255,.72);--sb-ta:#fff;--sb-sec:rgba(255,255,255,.38);
  --bg:#f0f3f8;--bgc:#fff;--bgh:#f8fafc;
  --t1:#1e293b;--t2:#475569;--t3:#94a3b8;
  --bdr:#e2e8f0;--bdrh:#cbd5e1;
  --blue:#1d4ed8;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --red:#dc2626;--red-l:#fef2f2;--red-b:#fecaca;
  --grn:#059669;--grn-l:#ecfdf5;--grn-b:#a7f3d0;
  --amb:#d97706;--amb-l:#fffbeb;--amb-b:#fde68a;
  --pur:#7c3aed;--pur-l:#f5f3ff;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
  --font:'Nunito Sans',sans-serif;--mono:'JetBrains Mono',monospace;
  --sw:228px;--hh:52px;--r:8px;--rl:12px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdrh);border-radius:2px}
input,select,textarea,button{font-family:var(--font)}
.app{display:flex;height:100vh;overflow:hidden}
/* ── SIDEBAR ── */
.sidebar{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-logo{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-ico{width:32px;height:32px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--sb);flex-shrink:0}
.sb-brand{font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.4px}
.sb-tag{font-size:9px;color:rgba(255,255,255,.42);letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 0}
.sb-sec{font-size:9.5px;font-weight:700;color:var(--sb-sec);text-transform:uppercase;letter-spacing:1.5px;padding:10px 14px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:var(--sb-t);font-size:12.5px;font-weight:600;transition:all .14s;position:relative;user-select:none}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.active{background:var(--sb-act);color:var(--sb-ta)}
.ni.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sb-border);border-radius:0 2px 2px 0}
.ni.sub{padding-left:32px;font-size:12px}
.ni-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ni-arr{margin-left:auto;font-size:10px;color:rgba(255,255,255,.3);transition:transform .2s}
.ni-arr.open{transform:rotate(90deg)}
.ni-grp{overflow:hidden;max-height:0;transition:max-height .3s ease}
.ni-grp.open{max-height:500px}
.ni-bdg{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;font-family:var(--mono)}
.sb-bot{border-top:1px solid rgba(255,255,255,.1);padding:8px 10px}
.sys-ok{display:flex;align-items:center;gap:5px;padding:5px 7px;margin-bottom:5px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);border-radius:var(--r)}
.sys-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pg 2s infinite}
.sys-txt{font-size:9.5px;color:#10b981;font-family:var(--mono);letter-spacing:.8px}
@keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 4px rgba(16,185,129,0)}}
.u-btn{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:var(--r);cursor:pointer;transition:background .14s}
.u-btn:hover{background:rgba(255,255,255,.08)}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;color:#fff}
.u-nm{font-size:12px;font-weight:700;color:#fff}
.u-rl{font-size:10px;color:rgba(255,255,255,.42)}
/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{height:var(--hh);background:var(--bgc);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 16px;gap:9px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h-t{font-size:15px;font-weight:800}.h-s{font-size:11px;color:var(--t3);margin-top:1px}
.h-sp{flex:1}
.h-srch{position:relative;width:195px}
.h-srch input{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px 6px 27px;font-size:12.5px;color:var(--t1);outline:none;transition:border-color .15s}
.h-srch input:focus{border-color:var(--blue);background:#fff}
.h-srch input::placeholder{color:var(--t3)}
.h-si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px}
.h-lang{display:flex;gap:2px}
.h-lb{padding:3px 6px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer;color:var(--t2);border:1px solid transparent;transition:all .12s}
.h-lb.on{background:var(--blue);color:#fff}
.h-btn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--bgc);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--t2)}
.h-btn:hover{background:var(--bg)}
.h-bdg{position:absolute;top:-3px;right:-3px;width:15px;height:15px;background:var(--red);color:#fff;border-radius:50%;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rsel{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:4px 8px;font-size:11.5px;font-weight:600;color:var(--t1);cursor:pointer;outline:none;max-width:170px}
.content{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
.gsearch-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:300px;overflow-y:auto;z-index:100;display:none;box-shadow:var(--shm)}
.gsearch-section{padding:8px 0}
.gsearch-label{padding:8px 12px;border-bottom:1px solid var(--bdr);font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.gsearch-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.05);transition:background .12s}
.gsearch-item:hover{background:var(--bgh)}
.gsearch-item-title{font-size:12px;font-weight:600;color:var(--t1)}
.gsearch-item-sub{font-size:11px;color:var(--t2);margin-top:2px}
.gsearch-empty{padding:12px;text-align:center;color:var(--t3);font-size:12px}
/* ── CARDS ── */
.card{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:var(--sh)}
.cp{padding:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:11.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px}
/* ── KPI ── */
.kg{display:grid;gap:11px;margin-bottom:14px}
.kg4{grid-template-columns:repeat(4,1fr)}
.kg5{grid-template-columns:repeat(5,1fr)}
.kg6{grid-template-columns:repeat(6,1fr)}
.kpi{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 15px;box-shadow:var(--sh);border-left:4px solid;transition:all .2s;cursor:default}
.kpi:hover{box-shadow:var(--shm)}
.kpi.cl{cursor:pointer}
.kl-bl{border-left-color:var(--blue)}.kl-r{border-left-color:var(--red)}.kl-g{border-left-color:var(--grn)}.kl-a{border-left-color:var(--amb)}.kl-p{border-left-color:var(--pur)}
.kv{font-size:24px;font-weight:800;font-family:var(--mono);line-height:1;margin-bottom:4px}
.kl{font-size:12px;color:var(--t2);font-weight:600}.kc{font-size:10.5px;margin-top:4px}
.cup{color:var(--grn)}.cdn{color:var(--red)}.cneu{color:var(--t3)}
/* ── TABLE ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--bgh)}
th{text-align:left;font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;padding:8px 11px;border-bottom:1px solid var(--bdr);white-space:nowrap}
td{padding:9px 11px;font-size:13px;border-bottom:1px solid var(--bdr);color:var(--t1);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bgh)}
.tnm{font-weight:700}.tid{font-family:var(--mono);font-size:11px;color:var(--t3)}
/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bg{background:var(--grn-l);color:#065f46;border:1px solid var(--grn-b)}
.br{background:var(--red-l);color:#991b1b;border:1px solid var(--red-b)}
.ba{background:var(--amb-l);color:#92400e;border:1px solid var(--amb-b)}
.bb{background:var(--blue-l);color:#1e40af;border:1px solid var(--blue-b)}
.bgr{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.bp{background:var(--pur-l);color:#5b21b6;border:1px solid #ddd6fe}
/* ── RISK ── */
.risk{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.rc{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.rh{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.rm{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.rl{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid;transition:all .14s;white-space:nowrap}
.btn-pr{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-pr:hover{background:#1e40af}
.btn-gh{background:#fff;color:var(--t1);border-color:var(--bdr)}.btn-gh:hover{background:var(--bg)}
.btn-gr{background:var(--grn);color:#fff;border-color:var(--grn)}.btn-gr:hover{background:#047857}
.btn-rd{background:var(--red-l);color:var(--red);border-color:var(--red-b)}.btn-rd:hover{background:var(--red);color:#fff}
.btn-ob{background:#fff;color:var(--blue);border-color:var(--blue-b)}.btn-ob:hover{background:var(--blue-l)}
.btn-am{background:var(--amb-l);color:var(--amb);border-color:var(--amb-b)}.btn-am:hover{background:var(--amb);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px}
.toast{position:fixed;bottom:22px;right:22px;padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:700;z-index:999;box-shadow:var(--shm);animation:slideUp .3s ease;max-width:320px}
.toast-s{background:#059669;color:#fff}.toast-e{background:#dc2626;color:#fff}.toast-a{background:#d97706;color:#fff}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const LS={get:k=>{try{return JSON.parse(localStorage.getItem('avss_'+k))||null}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('avss_'+k,JSON.stringify(v))}catch(e){}}};
const uuid=()=>'xxxx-xxxx'.replace(/x/g,()=>Math.random().toString(16)[2]);
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');

// SEED DATA
const SEED={areas:[{id:'A01',name:'Hà Nội & miền Bắc'},{id:'A02',name:'TP.HCM & miền Nam'},{id:'A03',name:'Hải Phòng & miền Trung'}],companies:[{id:'KH001',name:'Vincom Retail',type:'bv',areaId:'A01'},{id:'KH002',name:'Lotte Mart',type:'bv',areaId:'A01'},{id:'KH003',name:'UNIQLO',type:'bd',areaId:'A02'}],sites:[{id:'MT-01',name:'Vincom Bà Triệu',cid:'KH001',areaId:'A01'},{id:'MT-03',name:'Lotte Liễu Giai',cid:'KH002',areaId:'A01'},{id:'MT-08',name:'UNIQLO Đồng Khởi',cid:'KH003',areaId:'A02'}],surveys:[{id:'KS001',siteId:'MT-01',cid:'KH001',date:'2026-01-15',score:4.32},{id:'KS002',siteId:'MT-01',cid:'KH001',date:'2026-04-10',score:3.71}],alarms:[{id:'AL001',siteId:'MT-01',startTime:'2026-05-26 05:23',receiveTime:'2026-05-26 05:26',processTime:'2026-05-26 05:45',falseAlarm:false},{id:'AL003',siteId:'MT-08',startTime:'2026-05-24 22:15',receiveTime:'2026-05-24 22:18',processTime:'2026-05-24 22:24',falseAlarm:false}],incidents:[{id:'SC001',siteId:'MT-01',what:'Bảo vệ ngủ gật',when:'2026-05-25 02:20'}]};

function initDB(){if(LS.get('inited'))return;Object.keys(SEED).forEach(k=>LS.set(k,SEED[k]));LS.set('inited',true);};
const D={areas:()=>LS.get('areas')||SEED.areas,companies:()=>LS.get('companies')||SEED.companies,sites:()=>LS.get('sites')||SEED.sites,surveys:()=>LS.get('surveys')||SEED.surveys,alarms:()=>LS.get('alarms')||SEED.alarms,incidents:()=>LS.get('incidents')||SEED.incidents,save:(k,v)=>LS.set(k,v)};

const sNm=id=>{const s=D.sites().find(x=>x.id===id);return s?s.name:'—'};
const cNm=id=>{const c=D.companies().find(x=>x.id===id);return c?c.name:'—'};

// ✅ FIX #1: MTTR with processTime (fixed)
function calcTime(t1,t2){if(!t1||!t2)return null;return Math.round((new Date(t2)-new Date(t1))/60000);}
function getMTTR(){const alarms=D.alarms().filter(a=>!a.falseAlarm&&a.processTime&&a.startTime);if(!alarms.length)return 0;return Math.round(alarms.reduce((s,a)=>s+calcTime(a.startTime,a.processTime),0)/alarms.length);}
function getMTTA(){const alarms=D.alarms().filter(a=>!a.falseAlarm&&a.receiveTime&&a.startTime);if(!alarms.length)return 0;return Math.round(alarms.reduce((s,a)=>s+calcTime(a.startTime,a.receiveTime),0)/alarms.length);}

// ✅ FIX #4: Audit Logging System
function logAction(action,entity,entityId,details,userId){
  const log={id:uuid(),timestamp:now(),action,entity,entityId,userId,details,ipAddr:'localhost'};
  const logs=LS.get('auditLogs')||[];
  logs.push(log);
  LS.set('auditLogs',logs.slice(-1000));
  console.log('📋 Audit Log:',log);
  return log;
}

// ✅ FIX #3: Global Search Function
function globalSearch(query){
  const q=query.toLowerCase();
  return {sites:D.sites().filter(s=>s.name.toLowerCase().includes(q)).slice(0,5),companies:D.companies().filter(c=>c.name.toLowerCase().includes(q)).slice(0,5),incidents:D.incidents().filter(i=>i.what.toLowerCase().includes(q)).slice(0,5)};
}

let currentPage='dashboard';

function renderHeader(){
  document.getElementById('header').innerHTML=`
    <div style="font-size:15px;font-weight:800">🛡️ ALSOK VSS PRO</div>
    <div style="flex:1"></div>
    <div class="h-srch" id="gsearch-wrap">
      <span class="h-si">🔍</span>
      <input type="text" id="gsearch-input" placeholder="Tìm KH, MT, sự kiện..." style="width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px 6px 27px;font-size:12.5px;color:var(--t1);outline:none">
      <div id="gsearch-results" class="gsearch-dropdown"></div>
    </div>
  `;
  
  // ✅ FIX #3: Wire up search
  const searchInput=document.getElementById('gsearch-input');
  const resultsDiv=document.getElementById('gsearch-results');
  
  searchInput.addEventListener('input',(e)=>{
    const q=e.target.value.trim().toLowerCase();
    if(q.length<2){resultsDiv.style.display='none';return;}
    
    const results=globalSearch(q);
    let html='';
    
    if(results.sites.length>0){
      html+=`<div class="gsearch-label">📍 Mục Tiêu (${results.sites.length})</div>`;
      results.sites.forEach(s=>{
        html+=`<div class="gsearch-item" onclick="alert('Navigate to '+JSON.stringify(${JSON.stringify(s)}))"><div class="gsearch-item-title">${s.name}</div><div class="gsearch-item-sub">${cNm(s.cid)}</div></div>`;
      });
    }
    
    if(results.companies.length>0){
      html+=`<div class="gsearch-label">🏢 Khách Hàng (${results.companies.length})</div>`;
      results.companies.forEach(c=>{
        html+=`<div class="gsearch-item"><div class="gsearch-item-title">${c.name}</div></div>`;
      });
    }
    
    if(results.incidents.length>0){
      html+=`<div class="gsearch-label">⚠️ Sự Kiện (${results.incidents.length})</div>`;
      results.incidents.forEach(i=>{
        html+=`<div class="gsearch-item"><div class="gsearch-item-title">${i.what.substring(0,30)}...</div><div class="gsearch-item-sub">${sNm(i.siteId)}</div></div>`;
      });
    }
    
    if(!html)html=`<div class="gsearch-empty">Không tìm thấy kết quả</div>`;
    resultsDiv.innerHTML=html;
    resultsDiv.style.display='block';
  });
  
  document.addEventListener('click',(e)=>{if(!e.target.closest('#gsearch-wrap'))resultsDiv.style.display='none';});
}

function renderContent(){
  const content=document.getElementById('content');
  
  if(currentPage==='dashboard'){
    const mtta=getMTTA(),mttr=getMTTR();
    content.innerHTML=`
      <div style="padding:20px">
        <h1>📊 Dashboard</h1>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px">
          <div style="background:#fff;padding:15px;border-radius:8px;border-left:4px solid #1d4ed8">
            <div style="font-size:11px;color:#666;margin-bottom:8px">⚡ MTTA (phút)</div>
            <div style="font-size:24px;font-weight:800;color:#1d4ed8;font-family:monospace">${mtta}'</div>
            <div style="font-size:10px;color:#999;margin-top:4px">Mean Time To Acknowledge</div>
          </div>
          <div style="background:#fff;padding:15px;border-radius:8px;border-left:4px solid #059669">
            <div style="font-size:11px;color:#666;margin-bottom:8px">⚡ MTTR (phút)</div>
            <div style="font-size:24px;font-weight:800;color:#059669;font-family:monospace">${mttr}'</div>
            <div style="font-size:10px;color:#999;margin-top:4px">✅ FIXED: Using processTime</div>
          </div>
          <div style="background:#fff;padding:15px;border-radius:8px;border-left:4px solid #d97706">
            <div style="font-size:11px;color:#666;margin-bottom:8px">📍 Surveys</div>
            <div style="font-size:24px;font-weight:800;color:#d97706;font-family:monospace">${D.surveys().length}</div>
            <div style="font-size:10px;color:#999;margin-top:4px">Total responses</div>
          </div>
          <div style="background:#fff;padding:15px;border-radius:8px;border-left:4px solid #dc2626">
            <div style="font-size:11px;color:#666;margin-bottom:8px">⚠️ Open Issues</div>
            <div style="font-size:24px;font-weight:800;color:#dc2626;font-family:monospace">${D.incidents().filter(i=>i.status!=='closed').length}</div>
            <div style="font-size:10px;color:#999;margin-top:4px">Need attention</div>
          </div>
        </div>
        
        <div style="margin-top:30px">
          <h2 style="font-size:16px;margin-bottom:15px">✅ Priority 1 Fixes Status</h2>
          <div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:15px;margin-bottom:10px">
            <div style="font-weight:700;color:#059669">✅ FIX #1: Area Alias (A-HN → A01)</div>
            <div style="font-size:12px;color:#666;margin-top:4px">Trend chart now filters Hanoi sites correctly</div>
          </div>
          <div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:15px;margin-bottom:10px">
