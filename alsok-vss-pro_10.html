<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALSOK VSS — CRM Vận hành Bảo vệ PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sb:#1a2f5e;--sb2:#223a72;--sb-act:rgba(59,130,246,.18);--sb-border:#3b82f6;
  --sb-t:rgba(255,255,255,.72);--sb-ta:#fff;--sb-sec:rgba(255,255,255,.38);
  --bg:#f0f3f8;--bgc:#fff;--bgh:#f8fafc;
  --t1:#1e293b;--t2:#475569;--t3:#94a3b8;
  --bdr:#e2e8f0;--bdrh:#cbd5e1;
  --blue:#1d4ed8;--blue-l:#eff6ff;--blue-b:#bfdbfe;
  --red:#dc2626;--red-l:#fef2f2;--red-b:#fecaca;
  --grn:#059669;--grn-l:#ecfdf5;--grn-b:#a7f3d0;
  --amb:#d97706;--amb-l:#fffbeb;--amb-b:#fde68a;
  --pur:#7c3aed;--pur-l:#f5f3ff;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shm:0 4px 12px rgba(0,0,0,.1),0 2px 4px rgba(0,0,0,.06);
  --font:'Nunito Sans',sans-serif;--mono:'JetBrains Mono',monospace;
  --sw:228px;--hh:52px;--r:8px;--rl:12px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdrh);border-radius:2px}
input,select,textarea,button{font-family:var(--font)}
.app{display:flex;height:100vh;overflow:hidden}
/* ── SIDEBAR ── */
.sidebar{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-logo{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-ico{width:32px;height:32px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--sb);flex-shrink:0}
.sb-brand{font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.4px}
.sb-tag{font-size:9px;color:rgba(255,255,255,.42);letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
.sb-nav{flex:1;overflow-y:auto;padding:6px 0}
.sb-sec{font-size:9.5px;font-weight:700;color:var(--sb-sec);text-transform:uppercase;letter-spacing:1.5px;padding:10px 14px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:var(--sb-t);font-size:12.5px;font-weight:600;transition:all .14s;position:relative;user-select:none}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.active{background:var(--sb-act);color:var(--sb-ta)}
.ni.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sb-border);border-radius:0 2px 2px 0}
.ni.sub{padding-left:32px;font-size:12px}
.ni-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.ni-arr{margin-left:auto;font-size:10px;color:rgba(255,255,255,.3);transition:transform .2s}
.ni-arr.open{transform:rotate(90deg)}
.ni-grp{overflow:hidden;max-height:0;transition:max-height .3s ease}
.ni-grp.open{max-height:500px}
.ni-bdg{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;font-family:var(--mono)}
.sb-bot{border-top:1px solid rgba(255,255,255,.1);padding:8px 10px}
.sys-ok{display:flex;align-items:center;gap:5px;padding:5px 7px;margin-bottom:5px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);border-radius:var(--r)}
.sys-dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pg 2s infinite}
.sys-txt{font-size:9.5px;color:#10b981;font-family:var(--mono);letter-spacing:.8px}
@keyframes pg{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}50%{box-shadow:0 0 0 4px rgba(16,185,129,0)}}
.u-btn{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:var(--r);cursor:pointer;transition:background .14s}
.u-btn:hover{background:rgba(255,255,255,.08)}
.u-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;color:#fff}
.u-nm{font-size:12px;font-weight:700;color:#fff}
.u-rl{font-size:10px;color:rgba(255,255,255,.42)}
/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.header{height:var(--hh);background:var(--bgc);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 16px;gap:9px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h-t{font-size:15px;font-weight:800}.h-s{font-size:11px;color:var(--t3);margin-top:1px}
.h-sp{flex:1}
.h-srch{position:relative;width:195px}
.h-srch input{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px 6px 27px;font-size:12.5px;color:var(--t1);outline:none;transition:border-color .15s}
.h-srch input:focus{border-color:var(--blue);background:#fff}
.h-srch input::placeholder{color:var(--t3)}
.h-si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px}
.h-lang{display:flex;gap:2px}
.h-lb{padding:3px 6px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer;color:var(--t2);border:1px solid transparent;transition:all .12s}
.h-lb.on{background:var(--blue);color:#fff}
.h-btn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--bgc);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--t2);transition:all .12s;position:relative}
.h-btn:hover{background:var(--bg)}
.h-bdg{position:absolute;top:-3px;right:-3px;width:15px;height:15px;background:var(--red);color:#fff;border-radius:50%;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bgc)}
.rsel{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:4px 8px;font-size:11.5px;font-weight:600;color:var(--t1);cursor:pointer;outline:none;max-width:170px}
.content{flex:1;overflow-y:auto;padding:16px;background:var(--bg)}
/* ── CARDS ── */
.card{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);box-shadow:var(--sh)}
.cp{padding:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:11.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.6px}
/* ── KPI ── */
.kg{display:grid;gap:11px;margin-bottom:14px}
.kg4{grid-template-columns:repeat(4,1fr)}
.kg5{grid-template-columns:repeat(5,1fr)}
.kg6{grid-template-columns:repeat(6,1fr)}
.kpi{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px 15px;box-shadow:var(--sh);border-left:4px solid;transition:all .2s;cursor:default}
.kpi:hover{box-shadow:var(--shm)}
.kpi.cl{cursor:pointer}
.kl-bl{border-left-color:var(--blue)}.kl-r{border-left-color:var(--red)}.kl-g{border-left-color:var(--grn)}.kl-a{border-left-color:var(--amb)}.kl-p{border-left-color:var(--pur)}
.kv{font-size:24px;font-weight:800;font-family:var(--mono);line-height:1;margin-bottom:4px}
.kl{font-size:12px;color:var(--t2);font-weight:600}.kc{font-size:10.5px;margin-top:4px}
.cup{color:var(--grn)}.cdn{color:var(--red)}.cneu{color:var(--t3)}
/* ── TABLE ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--bgh)}
th{text-align:left;font-size:10.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;padding:8px 11px;border-bottom:1px solid var(--bdr);white-space:nowrap}
td{padding:9px 11px;font-size:13px;border-bottom:1px solid var(--bdr);color:var(--t1);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bgh)}
.tnm{font-weight:700}.tid{font-family:var(--mono);font-size:11px;color:var(--t3)}
/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bg{background:var(--grn-l);color:#065f46;border:1px solid var(--grn-b)}
.br{background:var(--red-l);color:#991b1b;border:1px solid var(--red-b)}
.ba{background:var(--amb-l);color:#92400e;border:1px solid var(--amb-b)}
.bb{background:var(--blue-l);color:#1e40af;border:1px solid var(--blue-b)}
.bgr{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.bp{background:var(--pur-l);color:#5b21b6;border:1px solid #ddd6fe}
/* ── RISK ── */
.risk{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.rc{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.rh{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.rm{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.rl{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
/* ── SCORE BAR ── */
.sb2{display:flex;align-items:center;gap:8px}
.st2{flex:1;height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;min-width:70px}
.sf2{height:100%;border-radius:3px;transition:width .5s}
.sv2{font-family:var(--mono);font-size:12px;font-weight:700;min-width:28px}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid;transition:all .14s;white-space:nowrap;font-family:var(--font)}
.btn-pr{background:var(--blue);color:#fff;border-color:var(--blue)}.btn-pr:hover{background:#1e40af}
.btn-gh{background:#fff;color:var(--t1);border-color:var(--bdr)}.btn-gh:hover{background:var(--bg)}
.btn-gr{background:var(--grn);color:#fff;border-color:var(--grn)}.btn-gr:hover{background:#047857}
.btn-rd{background:var(--red-l);color:var(--red);border-color:var(--red-b)}.btn-rd:hover{background:var(--red);color:#fff}
.btn-ob{background:#fff;color:var(--blue);border-color:var(--blue-b)}.btn-ob:hover{background:var(--blue-l)}
.btn-am{background:var(--amb-l);color:var(--amb);border-color:var(--amb-b)}.btn-am:hover{background:var(--amb);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11px}
/* ── TOOLBAR ── */
.tb{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.srch{position:relative;flex:1;max-width:230px}
.srch input{width:100%;background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px 6px 27px;font-size:13px;color:var(--t1);outline:none;transition:border-color .15s}
.srch input:focus{border-color:var(--blue)}
.srch input::placeholder{color:var(--t3)}
.si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px}
.fsl{background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:6px 10px;color:var(--t2);font-size:12.5px;outline:none;cursor:pointer}
.fsl:focus{border-color:var(--blue)}
.sp{flex:1}
/* ── TABS ── */
.tab-b{display:flex;border-bottom:2px solid var(--bdr);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 14px;font-size:13px;font-weight:700;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .14s}
.tab:hover{color:var(--t1);background:var(--bgh)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px)}
.ov.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:14px;width:580px;max-width:96vw;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(12px);transition:transform .2s}
.ov.open .modal{transform:translateY(0)}
.mt{font-size:15px;font-weight:800;color:var(--t1);margin-bottom:3px}
.ms{font-size:12px;color:var(--t3);margin-bottom:14px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fi,.fs,.fta{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 11px;color:var(--t1);font-size:13px;outline:none;transition:border-color .15s;font-family:var(--font)}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--blue);background:#fff}
.fi::placeholder{color:var(--t3)}
.fta{resize:vertical;min-height:68px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:13px;border-top:1px solid var(--bdr)}
/* ── MODULE HEADER ── */
.mh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.mt2{font-size:19px;font-weight:800;color:var(--t1);line-height:1.2}
.ms2{font-size:12px;color:var(--t3);margin-top:3px}
.mhr{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-start;flex-shrink:0}
/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px;margin-bottom:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:13px}
.g64{display:grid;grid-template-columns:5fr 3fr;gap:13px;margin-bottom:13px}
.g60{display:grid;grid-template-columns:3fr 2fr;gap:13px;margin-bottom:13px}
.g70{display:grid;grid-template-columns:7fr 4fr;gap:13px;margin-bottom:13px}
/* ── CHART ── */
.chw{position:relative}
/* ── ALERT BOX ── */
.alert-box{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:var(--r);border:1px solid;margin-bottom:12px}
.alert-r{background:var(--red-l);border-color:var(--red-b)}
.alert-a{background:var(--amb-l);border-color:var(--amb-b)}
.alert-g{background:var(--grn-l);border-color:var(--grn-b)}
/* ── LIKERT ── */
.likert{display:flex;gap:6px;margin-top:5px}
.lk-opt{width:34px;height:34px;border-radius:50%;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:700;transition:all .14s;color:var(--t2)}
.lk-opt:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.lk-opt.sel{border-color:var(--blue);background:var(--blue);color:#fff}
/* ── 5W1H FORM ── */
.w5h1-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w5h1-label{font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.w5h1-tag{background:var(--blue);color:#fff;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:800}
/* ── TIMELINE ── */
.tl-it{position:relative;padding-left:22px;margin-bottom:12px}
.tl-it::before{content:'';position:absolute;left:7px;top:14px;bottom:-12px;width:1.5px;background:var(--bdr)}
.tl-it:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid;background:#fff;display:flex;align-items:center;justify-content:center;font-size:7px}
/* ── DETAIL ROW ── */
.dl{display:flex;padding:7px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.dl:last-child{border-bottom:none}
.dl-l{width:130px;color:var(--t2);flex-shrink:0;font-size:12px;font-weight:600}
.dl-v{font-weight:500}
/* ── NOTIF PANEL ── */
.np{position:absolute;top:var(--hh);right:0;width:285px;background:#fff;border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--rl) var(--rl);box-shadow:var(--shm);z-index:50;display:none}
.np-hd{padding:9px 13px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.np-it{padding:9px 13px;border-bottom:1px solid var(--bdr);cursor:pointer;transition:background .12s;display:flex;gap:8px}
.np-it:hover{background:var(--bgh)}
.np-it:last-child{border-bottom:none}
/* ── UTILITY ── */
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb14{margin-bottom:14px}
.t2{color:var(--t2)}.t3{color:var(--t3)}.blue{color:var(--blue)}.red{color:var(--red)}.grn{color:var(--grn)}.amb{color:var(--amb)}
.mono{font-family:var(--mono)}.fw7{font-weight:700}.fw8{font-weight:800}
.rb{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:800}
.rb-d{background:#fee2e2;color:#dc2626}.rb-r{background:#dbeafe;color:#1d4ed8}
.rb-o{background:#dcfce7;color:#166534}.rb-c{background:#f3e8ff;color:#7c3aed}
@media(max-width:1100px){.kg4,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.toast{position:fixed;bottom:22px;right:22px;padding:12px 18px;border-radius:var(--r);font-size:13px;font-weight:700;z-index:999;box-shadow:var(--shm);animation:slideUp .3s ease;max-width:320px;display:flex;align-items:center;gap:8px}
.toast-s{background:#059669;color:#fff}.toast-e{background:#dc2626;color:#fff}.toast-a{background:#d97706;color:#fff}
.imp-col{display:inline-block;background:var(--blue-l);color:var(--blue);padding:2px 7px;border-radius:4px;font-size:11px;font-family:var(--mono);margin:2px}
.preview-tbl{width:100%;border-collapse:collapse;font-size:12px}
.preview-tbl th{background:var(--bgh);padding:6px 8px;font-size:10.5px;font-weight:700;color:var(--t3);text-align:left;border-bottom:1px solid var(--bdr);white-space:nowrap}
.preview-tbl td{padding:5px 8px;border-bottom:1px solid rgba(0,0,0,.05);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header" id="header"></header>
    <div class="content" id="content"></div>
    <div class="np" id="np"></div>
  </div>
</div>
<div class="ov" id="ov" onclick="CM(event)">
  <div class="modal" id="mbox" onclick="event.stopPropagation()"><div id="mc"></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// OFFLINE STORAGE — localStorage simulating SQLite
// ═══════════════════════════════════════════════════════════════
const LS={
  get:k=>{try{return JSON.parse(localStorage.getItem('avss_'+k))||null}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem('avss_'+k,JSON.stringify(v))}catch(e){}},
  reset:()=>{Object.keys(localStorage).filter(k=>k.startsWith('avss_')).forEach(k=>localStorage.removeItem(k))},
};
const uuid=()=>'xxxx-xxxx'.replace(/x/g,()=>Math.random().toString(16)[2]);
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
const today=()=>new Date().toISOString().slice(0,10);

// MTTA/MTTR calculation
function calcTime(t1,t2){
  if(!t1||!t2)return null;
  return Math.round((new Date(t2)-new Date(t1))/60000);
}
function getMTTA(){
  const alarms=D.alarms().filter(a=>!a.falseAlarm&&a.receiveTime&&a.startTime);
  if(!alarms.length)return 0;
  return Math.round(alarms.reduce((s,a)=>s+calcTime(a.startTime,a.receiveTime),0)/alarms.length);
}
function getMTTR(){
  const alarms=D.alarms().filter(a=>!a.falseAlarm&&a.recoveryTime&&a.startTime);
  if(!alarms.length)return 0;
  return Math.round(alarms.reduce((s,a)=>s+calcTime(a.startTime,a.recoveryTime),0)/alarms.length);
}
function getSLARate(){
  const disp=D.dispatches();
  if(!disp.length)return 100;
  const ok=disp.filter(dc=>{
    const team=D.teams().find(t=>t.id===dc.teamId);
    const mins=calcTime(dc.dispatchTime,dc.arrivalTime);
    return mins&&team&&mins<=team.sla;
  }).length;
  return Math.round(ok/disp.length*100);
}
function calcSurveyScore(answers,questions){
  const totalW=questions.reduce((s,q)=>s+q.weight,0);
  const weighted=questions.reduce((s,q,i)=>s+(answers[i]||0)*q.weight,0);
  return+(weighted/totalW).toFixed(2);
}
function calcRisk(score){
  return score>=4?'low':score>=3.5?'medium':score>=3?'high':'critical';
}
function getAvgScore(){
  const sv=D.surveys();if(!sv.length)return 0;
  return+(sv.reduce((s,x)=>s+x.score,0)/sv.length).toFixed(2);
}
function getViolationRate(){
  const viol=D.incidents().filter(i=>i.type==='violation').length;
  const sites=D.sites().length;
  return+(viol/sites).toFixed(2);
}
function getFalseAlarmRate(){
  const al=D.alarms();
  if(!al.length)return 0;
  return Math.round(al.filter(a=>a.falseAlarm).length/al.length*100);
}
// Risk flagging: score declining 2+ periods
function getRiskFlags(){
  const sites=D.sites();const sv=D.surveys();const flags=[];
  sites.forEach(site=>{
    const siteSv=sv.filter(s=>s.siteId===site.id).sort((a,b)=>a.period.localeCompare(b.period));
    if(siteSv.length>=2){
      const last=siteSv[siteSv.length-1];
      const prev=siteSv[siteSv.length-2];
      if(last.score<prev.score&&(prev.score-last.score)>0.3){
        flags.push({site,last,prev,delta:+(prev.score-last.score).toFixed(2)});
      }
    }
    const latestSv=siteSv[siteSv.length-1];
    if(latestSv&&latestSv.risk==='critical'&&!flags.find(f=>f.site.id===site.id)){
      flags.push({site,last:latestSv,prev:null,delta:0,isCritical:true});
    }
  });
  return flags;
}

function initDashCharts(){
  const c=document.getElementById('trendChart');if(!c)return;
  
  // Calculate real trend data from surveys
  const surveys = D.surveys().sort((a,b)=>a.date.localeCompare(b.date));
  const monthsData = {};
  surveys.forEach(s => {
    const month = s.date.substring(0, 7); // YYYY-MM
    if(!monthsData[month]) monthsData[month] = { sum: 0, count: 0, hnSum: 0, hnCount: 0 };
    monthsData[month].sum += s.score;
    monthsData[month].count++;
    // Check if Hanoi site
    const site = D.sites().find(x => x.id === s.siteId);
    if(site && site.areaId === 'A-HN') {
      monthsData[month].hnSum += s.score;
      monthsData[month].hnCount++;
    }
  });

  const sortedMonths = Object.keys(monthsData).sort().slice(-6);
  const labels = sortedMonths.map(m => {
    const [y, mm] = m.split('-');
    return `T${mm}/${y.substring(2)}`;
  });
  
  const natData = sortedMonths.map(m => +(monthsData[m].sum / monthsData[m].count).toFixed(2));
  const hnData = sortedMonths.map(m => monthsData[m].hnCount > 0 ? +(monthsData[m].hnSum / monthsData[m].hnCount).toFixed(2) : null);
  const riskLine = sortedMonths.map(() => 3.0);

  try{ST.charts.trend=new Chart(c,{type:'line',data:{labels:labels.length ? labels : ['T10/25','T11/25','T12/25','T1/26','T2/26','T3/26'],datasets:[
    {label:'Điểm TB toàn quốc',data:natData.length ? natData : [4.1,4.0,3.9,3.8,3.7,3.6],borderColor:'#1d4ed8',backgroundColor:'rgba(29,78,216,.08)',fill:true,tension:.4,borderWidth:2,pointRadius:4,pointBackgroundColor:'#1d4ed8'},
    {label:'Điểm TB Hà Nội',data:hnData.length ? hnData : [4.2,4.1,4.0,3.9,3.8,3.7],borderColor:'#059669',backgroundColor:'transparent',tension:.4,borderWidth:2,pointRadius:3,pointBackgroundColor:'#059669'},
    {label:'Điểm rủi ro (3.0)',data:riskLine.length ? riskLine : [3,3,3,3,3,3],borderColor:'#ef4444',backgroundColor:'transparent',borderWidth:1.5,borderDash:[5,4],pointRadius:0},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11},boxWidth:12,padding:8}}},scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}},y:{min:2.5,max:5.0,grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}}}}});}catch(e){}
}

let gmapInst=null,gmapMarkers=[],gmapFilter='all',gmapRegion='all';

window.initGoogleMap=function(){
  const el=document.getElementById('gmap');
  if(!el)return;
  const ld=document.getElementById('gmap-load');if(ld)ld.style.display='none';
  const ct=document.getElementById('gmap-ctrl');if(ct)ct.style.display='block';
  const st=document.getElementById('gmap-status');if(st){st.textContent='✓ Google Maps API đã kết nối';st.style.color='var(--grn)';}

  gmapInst=new google.maps.Map(el,{
    center:{lat:16.5,lng:106.5},zoom:6,
    mapTypeId:'roadmap',
    styles:[
      {featureType:'water',elementType:'geometry',stylers:[{color:'#c9d8f0'}]},
      {featureType:'landscape',elementType:'geometry',stylers:[{color:'#f0f3f8'}]},
      {featureType:'road',elementType:'geometry',stylers:[{color:'#fff'}]},
      {featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#e2e8f0'}]},
      {featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]},
      {featureType:'administrative',elementType:'geometry.stroke',stylers:[{color:'#cbd5e1','weight':1.2}]},
    ],
    zoomControl:true,mapTypeControl:false,streetViewControl:false,fullscreenControl:true,
  });
  renderGmapMarkers();
};

function renderGmapMarkers(){
  if(!gmapInst)return;
  gmapMarkers.forEach(m=>m.setMap(null));gmapMarkers=[];
  const sites=D.sites().filter(s=>{
    if(gmapFilter!=='all'&&s.type!==gmapFilter)return false;
    if(gmapRegion!=='all'&&s.areaId!==gmapRegion)return false;
    return true;
  });
  const bounds=new google.maps.LatLngBounds();
  sites.forEach(site=>{
    const c=D.companies().find(x=>x.id===site.cid);
    const color=site.type==='bv'?'#dc2626':'#1d4ed8';
    const marker=new google.maps.Marker({
      position:{lat:site.lat,lng:site.lng},map:gmapInst,title:site.name,
      icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:color,fillOpacity:.9,strokeColor:'#fff',strokeWeight:2.5,scale:9},
      animation:google.maps.Animation.DROP,
    });
    const latestSv=D.surveys().filter(s=>s.siteId===site.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    const scoreHtml=latestSv?`<div style="margin-top:6px;font-size:12px"><span style="font-weight:700;color:${scC(latestSv.score)}">${latestSv.score}</span><span style="color:#666">/5.0 (${latestSv.period})</span></div>`:'';
    const iw=new google.maps.InfoWindow({content:`
      <div style="font-family:'Nunito Sans',sans-serif;padding:4px;min-width:180px">
        <div style="font-weight:800;font-size:14px;margin-bottom:4px">${site.name}</div>
        <div style="font-size:12px;color:#666;margin-bottom:2px">${cNm(site.cid)}</div>
        <div style="font-size:12px;color:#666">${site.addr}</div>
        <div style="display:inline-block;margin-top:6px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:${site.type==='bv'?'#fef2f2':'#eff6ff'};color:${site.type==='bv'?'#dc2626':'#1d4ed8'}">${site.type==='bv'?'Bảo vệ con người':'Thiết bị báo động'}</div>
        ${scoreHtml}
      </div>`
    });
    marker.addListener('click',()=>{iw.open(gmapInst,marker);});
    gmapMarkers.push(marker);
    bounds.extend({lat:site.lat,lng:site.lng});
  });
  if(sites.length>0)gmapInst.fitBounds(bounds,50);
  // Update QRT pins
  D.teams().forEach(team=>{
    const area=D.areas().find(a=>a.id===team.areaId);
    const centers={A01:{lat:21.03,lng:105.85},A02:{lat:10.78,lng:106.70},A03:{lat:20.86,lng:106.69}};
    const pos=centers[team.areaId]||{lat:16.5,lng:106.5};
    const marker=new google.maps.Marker({
      position:pos,map:gmapInst,title:team.name,
      icon:{path:'M 0,-12 L 6,4 L 0,0 L -6,4 Z',fillColor:'#f59e0b',fillOpacity:1,strokeColor:'#fff',strokeWeight:1.5,scale:1.2},
    });
    const iw2=new google.maps.InfoWindow({content:`<div style="font-family:sans-serif;padding:4px"><strong>⚡ ${team.name}</strong><br><span style="color:#666;font-size:12px">${team.members} thành viên • ${team.vehicle}</span></div>`});
    marker.addListener('click',()=>iw2.open(gmapInst,marker));
    gmapMarkers.push(marker);
  });
  const cnt=document.getElementById('gmap-count');if(cnt)cnt.textContent=`Hiển thị ${sites.length}/${D.sites().length} mục tiêu`;
}

function setGmapFilter(type,el){gmapFilter=type;el.closest('.mc-btn').parentElement.querySelectorAll('.mc-btn').forEach(b=>b.classList.remove('on'));el.classList.add('on');renderGmapMarkers();}
function setGmapRegion(reg,el){gmapRegion=reg;el.closest('.mc-btn').parentElement.querySelectorAll('.mc-btn').forEach(b=>b.classList.remove('on'));el.classList.add('on');renderGmapMarkers();}
function gmapFocusSite(lat,lng,name){if(gmapInst){gmapInst.setCenter({lat,lng});gmapInst.setZoom(16);}}
function gmapFitAll(){if(gmapInst&&gmapMarkers.length){const b=new google.maps.LatLngBounds();gmapMarkers.forEach(m=>b.extend(m.getPosition()));gmapInst.fitBounds(b,50);}}

function loadGoogleMaps(){
  if(window.google&&window.google.maps){if(document.getElementById('gmap'))initGoogleMap();return;}
  if(document.getElementById('gmaps-script'))return;
  const sc=document.createElement('script');
  sc.id='gmaps-script';
  sc.src='https://maps.googleapis.com/maps/api/js?key=AIzaSyDCMrqbkNp_qg4sYqePomnUR427CltUvK4&callback=initGoogleMap&language=vi';
  sc.async=true;sc.defer=true;
  sc.onerror=()=>{
    const st=document.getElementById('gmap-status');if(st){st.textContent='⚠ Lỗi kết nối API — kiểm tra key';st.style.color='var(--red)';}
    const ld=document.getElementById('gmap-load');if(ld)ld.innerHTML='<div style="text-align:center;color:#fff"><div style="font-size:32px;margin-bottom:10px">⚠️</div><div style="font-size:14px;font-weight:700">Không thể kết nối Google Maps API</div><div style="font-size:12px;opacity:.7;margin-top:6px">Kiểm tra API key hoặc kết nối mạng</div></div>';
  };
  document.head.appendChild(sc);
}

  <div class="mh">

    </div>
  </div>
  <div class="kg kg4 mb12">
    <div class="kpi kl-bl"><div class="kv blue">${D.alarms().length}</div><div class="kl">Tổng sự kiện báo động</div></div>
    <div class="kpi kl-g"><div class="kv" style="color:${mtta<=5?'var(--grn)':mtta<=10?'var(--amb)':'var(--red)'}">${mtta}'</div><div class="kl">MTTA (thời gian nhận tin)</div><div class="kc cneu">Chuẩn ≤ 5 phút</div></div>
    <div class="kpi kl-a"><div class="kv" style="color:${mttr<=60?'var(--grn)':mttr<=90?'var(--amb)':'var(--red)'}">${mttr}'</div><div class="kl">MTTR (thời gian khôi phục)</div><div class="kc cneu">Chuẩn ≤ 60 phút</div></div>
    <div class="kpi kl-r"><div class="kv red">${far}%</div><div class="kl">Tỷ lệ báo giả</div><div class="kc ${far<30?'cup':'cdn'}">Chuẩn &lt; 30%</div></div>
  </div>
  <div class="g60 mb12">
    <div class="card cp">
      <div class="ch"><span class="ct">📋 Nhật ký báo động</span></div>
      <div class="tw"><table>
        <thead><tr><th>Mã</th><th>Loại</th><th>Mục tiêu / KH</th><th>Thời gian</th><th>MTTA</th><th>MTTR</th><th>Nguyên nhân</th><th>Kết quả</th></tr></thead>
        <tbody>
          ${sDate(D.alarms()).map(a=>{
            const mtta2=calcTime(a.startTime,a.receiveTime);
            const mttr2=calcTime(a.startTime,a.recoveryTime);
            const causes={person:'Người đột nhập',animal:'Động vật',customer_error:'KH thao tác sai',device_error:'Lỗi thiết bị',staff:'Nhân viên công ty',environment:'Môi trường'};

              <td><span style="font-weight:700">${a.type}</span></td>
              <td><div style="font-size:12.5px;font-weight:700">${sNm(a.siteId)}</div><div style="font-size:11px;color:var(--t2)">${cNm(a.cid)}</div></td>
              <td style="font-family:var(--mono);font-size:11.5px;color:var(--t2)">${a.startTime.slice(11,16)}<br>${a.startTime.slice(0,10)}</td>
              <td><span style="font-family:var(--mono);font-weight:700;color:${mtta2&&mtta2<=5?'var(--grn)':mtta2&&mtta2<=10?'var(--amb)':'var(--red)'}">${mtta2?mtta2+"'":'-'}</span></td>
              <td><span style="font-family:var(--mono);font-weight:700;color:${mttr2&&mttr2<=60?'var(--grn)':'var(--amb)'}">${mttr2?mttr2+"'":'-'}</span></td>

          }).join('')}
        </tbody>
      </table></div>
    </div>
    <div>
      <div class="card cp mb12">
        <div class="ch"><span class="ct">🔍 Root Cause Analysis</span></div>
        ${Object.entries(D.alarms().reduce((acc,a)=>{acc[a.cause]=(acc[a.cause]||0)+1;return acc},{} )).sort((a,b)=>b[1]-a[1]).map(([cause,cnt])=>{
          const labels={person:'Người đột nhập',animal:'Động vật',customer_error:'KH thao tác sai',device_error:'Lỗi thiết bị',staff:'Nhân viên',environment:'Môi trường'};
          const pct=Math.round(cnt/D.alarms().length*100);
          return`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span style="font-weight:600">${labels[cause]||cause}</span><span style="font-family:var(--mono);font-weight:700">${cnt} (${pct}%)</span></div>
            <div style="height:5px;background:var(--bdr);border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--blue);border-radius:3px"></div></div></div>`;

      </div>
      <div class="card cp">
        <div class="ch"><span class="ct">📡 Top KH báo nhiều nhất</span></div>

          return`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bdr)">

          </div>`;
        }).filter(Boolean).join('')}
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// QRT — Dispatch & SLA
// ═══════════════════════════════════════════════════════════════
function pgQRT(){
  const slaR=getSLARate();
  return`
  <div class="mh">
    <div class="mh-l"><div class="mt2">Đội Phản ứng Nhanh (QRT)</div><div class="ms2">Quản lý điều động — SLA — Hiệu suất theo đội</div></div>
    <div style="display:flex;gap:7px">
      <button class="btn btn-gh btn-sm" onclick="exportExcel('dispatches')">${t('btn_export')}</button>
      ${can('edit')?`<button class="btn btn-am btn-sm" onclick="openAddQRT()">+ Thêm đội QRT</button>`:''}
    </div>
  </div>
  <div class="kg kg4 mb12">
    <div class="kpi kl-bl"><div class="kv blue">${D.teams().length}</div><div class="kl">Tổng đội QRT</div></div>
    <div class="kpi kl-g"><div class="kv grn">${D.teams().filter(t=>t.status==='ready').length}</div><div class="kl">Sẵn sàng</div></div>
    <div class="kpi kl-a"><div class="kv amb">${D.dispatches().length}</div><div class="kl">Tổng lần điều động</div></div>
    <div class="kpi ${slaR>=90?'kl-g':'kl-r'}"><div class="kv ${slaR>=90?'grn':'red'}">${slaR}%</div><div class="kl">Tuân thủ SLA</div></div>
  </div>
  <div class="g2 mb12">
    ${D.teams().map(team=>{
      const disp=D.dispatches().filter(dc=>dc.teamId===team.id);
      const avArr=disp.length?Math.round(disp.reduce((s,dc)=>s+calcTime(dc.dispatchTime,dc.arrivalTime),0)/disp.length):0;
      const slaPct=disp.length?Math.round(disp.filter(dc=>calcTime(dc.dispatchTime,dc.arrivalTime)<=team.sla).length/disp.length*100):100;
      return`<div class="card cp">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:38px;height:38px;border-radius:var(--r);background:${team.status==='ready'?'var(--grn-l)':'var(--amb-l)'};display:flex;align-items:center;justify-content:center;font-size:19px">⚡</div>
            <div><div style="font-weight:800;font-size:14px">${team.name}</div><div style="font-size:12px;color:var(--t2)">${aNm(team.areaId)}</div></div>
          </div>
          ${stBdg(team.status)}
        </div>
        ${[['Thành viên',team.members+' người'],['Phương tiện',team.vehicle],['SLA chuẩn',team.sla+' phút'],['TB đến nơi',avArr+' phút'],['Tuân thủ SLA',slaPct+'%']].map(([l,v])=>`<div class="dl"><span class="dl-l">${l}</span><span class="dl-v" style="font-weight:700">${v}</span></div>`).join('')}
        ${can('edit')?`<div style="margin-top:11px;display:flex;gap:6px"><button class="btn btn-pr btn-sm" onclick="dispatchTeam('${team.id}')">⚡ Điều động</button><button class="btn btn-gh btn-sm">📊 Lịch sử</button></div>`:''}
      </div>`;
    }).join('')}
  </div>
  <div class="card cp">
    <div class="ch"><span class="ct">📋 Lịch sử điều động</span></div>
    <div class="tw"><table>
      <thead><tr><th>Mã</th><th>Đội QRT</th><th>Báo động gốc</th><th>Xuất phát</th><th>Đến nơi</th><th>Hoàn tất</th><th>T.gian đến</th><th>SLA</th><th>Kết quả</th></tr></thead>
      <tbody>
        ${D.dispatches().map(dc=>{
          const team=D.teams().find(t=>t.id===dc.teamId);
          const alarm=D.alarms().find(a=>a.id===dc.alarmId);
          const arrTime=calcTime(dc.dispatchTime,dc.arrivalTime);
          const onSLA=team&&arrTime<=team.sla;
          return`<tr>
            <td class="tid">${dc.id}</td>
            <td class="tnm">${team?team.name:'—'}</td>
            <td style="font-size:12px">${alarm?alarm.type+' — '+sNm(alarm.siteId):'—'}</td>
            <td style="font-family:var(--mono);font-size:11.5px;color:var(--t2)">${dc.dispatchTime.slice(11,16)}</td>
            <td style="font-family:var(--mono);font-size:11.5px;color:var(--t2)">${dc.arrivalTime.slice(11,16)}</td>
            <td style="font-family:var(--mono);font-size:11.5px;color:var(--t2)">${dc.finishTime.slice(11,16)}</td>
            <td><span style="font-family:var(--mono);font-weight:800;font-size:14px;color:${slaColor(arrTime,team?.sla||15)}">${arrTime}'</span></td>
            <td>${onSLA?'<span class="badge bg">✓ Đúng hạn</span>':'<span class="badge br">✗ Trễ SLA</span>'}</td>
            <td style="font-size:12px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${dc.result}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
// PHÂN BỔ NHÂN SỰ
// ═══════════════════════════════════════════════════════════════
function pgPhanBo(){
  const sites=D.sites();const guards=D.guards();
  const gAct=sid=>guards.filter(g=>g.siteId===sid).length;
  const totPos=sites.reduce((a,s)=>a+(s.pos||0),0);
  const totDB=sites.reduce((a,s)=>a+(s.budget||0),0);
  const totAct=guards.length;
  const thieu=totAct-totDB;
  const pct=totDB>0?+(totAct/totDB*100).toFixed(1):0;
  return`
  <div class="mh">
    <div class="mh-l"><div class="mt2">Phân bổ Nhân sự (Manpower)</div><div class="ms2">Tỷ lệ bổ trí định biên theo từng mục tiêu</div></div>
    <div class="mhr">
      <button class="btn btn-gh btn-sm" onclick="openImport('guards')">${t('btn_import')}</button>
      <button class="btn btn-gh btn-sm" onclick="exportExcel('guards')">${t('btn_export')}</button>
    </div>
  </div>
  <div class="kg mb12" style="grid-template-columns:repeat(6,1fr)">
    <div class="kpi kl-bl"><div class="kv blue">${sites.length}</div><div class="kl">Mục tiêu</div></div>
    <div class="kpi kl-bl"><div class="kv blue">${totPos}</div><div class="kl">Vị trí</div></div>
    <div class="kpi kl-g"><div class="kv grn">${totDB}</div><div class="kl">Định biên</div></div>

// PATROL (unchanged)
// ═══════════════════════════════════════════════════════════════
function pgPatrol(){
  const guards = D.guards();
  const patrol = guards.map((g, i) => {
    let baseShift = g.shift.includes('Ca A') ? 'Ca A' : g.shift.includes('Ca B') ? 'Ca B' : g.shift.includes('Ca C') ? 'Ca C' : 'Ca A';
    const off1 = i % 7;
    const off2 = (i + 3) % 7;
    const s = (dayIdx) => (dayIdx === off1 || dayIdx === off2) ? 'Nghỉ' : baseShift;
    return {
      id: g.id, name: g.name,
      mon: s(0), tue: s(1), wed: s(2), thu: s(3), fri: s(4), sat: s(5), sun: s(6)
    };
  });
  const days=[{k:'mon',l:'Thứ 2'},{k:'tue',l:'Thứ 3'},{k:'wed',l:'Thứ 4'},{k:'thu',l:'Thứ 5'},{k:'fri',l:'Thứ 6'},{k:'sat',l:'T.7'},{k:'sun',l:'CN'}];
  const cs=v=>{if(v==='Ca A')return'background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-weight:700';if(v==='Ca B')return'background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;font-weight:700';if(v==='Ca C')return'background:#f5f3ff;color:#5b21b6;border:1px solid #ddd6fe;font-weight:700';return'background:#f8fafc;color:#94a3b8;border:1px solid #e2e8f0';};
  return`
  <div class="mh"><div class="mh-l"><div class="mt2">Lịch Tuần tra</div><div class="ms2">Phân ca trực định kỳ — tuần 22/05 → 28/05/2026</div></div></div>
  <div class="card cp">
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:separate;border-spacing:3px">
      <thead><tr>
        <th style="background:var(--bgh);border-radius:var(--r);padding:8px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--t3)">Nhân viên</th>
        ${days.map(d=>`<th style="background:var(--bgh);border-radius:var(--r);padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--t2)">${d.l}</th>`).join('')}
      </tr></thead>
      <tbody>${patrol.map((p,i)=>{
        const g=D.guards().find(x=>x.id===p.id);
        const site=g?D.sites().find(s=>s.id===g.siteId):null;
        return`<tr>
          <td style="background:#fff;border:1px solid var(--bdr);border-radius:var(--r);padding:7px 12px;white-space:nowrap">
            <div style="display:flex;align-items:center;gap:6px">
              <div style="width:22px;height:22px;border-radius:50%;background:${avb(i)};display:flex;align-items:center;justify-content:center;color:#fff;font-size:8.5px;font-weight:800">${ini(p.name)}</div>
              <div><div style="font-size:12px;font-weight:700">${p.name}</div><div style="font-size:10px;color:var(--t3)">${site?site.name:'—'}</div></div>
            </div>
          </td>
          ${days.map(d=>`<td style="${cs(p[d.k])};border-radius:6px;padding:5px;text-align:center;font-size:11px">${p[d.k]}</td>`).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

// CẢNH BÁO RỦI RO — Rule-based intelligent alerts

function pgCanhBao(){
  const flags=getRiskFlags();
  const overduActions=D.incidents().flatMap(i=>i.actions.filter(a=>a.status==='open'&&a.deadline<today()));
  const slowAlarms=D.alarms().filter(a=>!a.falseAlarm&&calcTime(a.startTime,a.receiveTime)>10);
  return`
  <div class="mh">
    <div class="mh-l"><div class="mt2">Cảnh báo Rủi ro</div><div class="ms2">Phát hiện tự động theo quy tắc — Smart Alerts</div></div>
    ${can('exp')?`<button class="btn btn-gh btn-sm">📊 Xuất báo cáo</button>`:''}
  </div>
  <div class="kg kg4 mb12">
    <div class="kpi kl-r"><div class="kv red">${flags.length}</div><div class="kl">Mục tiêu CL rủi ro</div></div>
    <div class="kpi kl-a"><div class="kv amb">${overduActions.length}</div><div class="kl">Đối sách quá hạn</div></div>
    <div class="kpi kl-r"><div class="kv red">${getFalseAlarmRate()}%</div><div class="kl">Báo giả vượt ngưỡng</div></div>
    <div class="kpi kl-a"><div class="kv amb">${slowAlarms.length}</div><div class="kl">Phản ứng chậm (&gt;10')</div></div>
  </div>
  <div class="g2 mb12">

      <div class="ch"><span class="ct">❗ Cảnh báo Chất lượng</span></div>
      ${flags.length===0?'<div style="text-align:center;padding:20px;color:var(--grn)">✓ Không có cảnh báo chất lượng</div>':
      flags.map(f=>{
        const sc={critical:'var(--red)',high:'var(--amb)',medium:'var(--blue)'}[f.last.risk];
        return`<div class="tl-it">
          <div class="tl-dot" style="border-color:${sc}"><span style="font-size:7px;color:${sc}">!</span></div>
          <div style="background:var(--bgh);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 12px;cursor:pointer" onclick="navSub('nghiepvu','khaosat')">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
              <div><div style="font-weight:800;font-size:13px">${f.site.name}</div><div style="font-size:11.5px;color:var(--t2)">${cNm(f.site.cid)} • ${f.last.period}</div></div>
              <div style="text-align:right;flex-shrink:0"><span class="${rCls(f.last.risk)} risk">${rLb(f.last.risk)}</span><div style="font-family:var(--mono);font-weight:800;font-size:16px;color:${scC(f.last.score)};margin-top:2px">${f.last.score.toFixed(2)}/5.0</div></div>
            </div>
            <div style="margin-top:6px;font-size:11.5px;color:${sc}">
              ${f.isCritical?'⚠ Mức độ nghiêm trọng — cần can thiệp ngay':f.delta>0?`📉 Giảm ${f.delta} điểm so với kỳ trước (${f.prev.score.toFixed(2)} → ${f.last.score.toFixed(2)})`:''}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div>
      <div class="card cp mb12">
        <div class="ch"><span class="ct">⏰ Đối sách quá hạn</span></div>
        ${overduActions.length===0?'<div style="text-align:center;padding:16px;color:var(--grn)">✓ Không có đối sách quá hạn</div>':
        overduActions.slice(0,5).map(ac=>`<div style="padding:7px 0;border-bottom:1px solid var(--bdr)">
          <div style="font-size:12.5px;font-weight:700">${ac.desc}</div>

        </div>`).join('')}
      </div>
      <div class="card cp">
        <div class="ch"><span class="ct">🚨 Quy tắc cảnh báo hệ thống</span></div>
        ${[
          {rule:'Điểm KS giảm 2 kỳ liên tiếp',count:flags.filter(f=>!f.isCritical).length,col:'var(--red)'},
          {rule:'Điểm KS < 3.0 (Nghiêm trọng)',count:D.surveys().filter(s=>s.risk==='critical').length,col:'var(--red)'},
          {rule:'Tỷ lệ báo giả > 30%',count:getFalseAlarmRate()>30?1:0,col:'var(--amb)'},
          {rule:'MTTA > 10 phút',count:slowAlarms.length,col:'var(--amb)'},
          {rule:'Đối sách quá hạn',count:overduActions.length,col:'var(--red)'},
          {rule:'Nhân sự bổ trí < 30%',count:D.sites().length,col:'var(--amb)'},
        ].map(r=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr)">
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:7px;height:7px;border-radius:50%;background:${r.count>0?r.col:'var(--grn)'}"></div>

      </div>`).join('')}

}

function selLikert(qIdx,val,el){selLikert2(qIdx,val,el,'ks-lk-');}
function selLikert2(qIdx,val,el,prefix){
  el.closest('.likert').querySelectorAll('.lk-opt').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');
  const answers=prefix==='esk-lk-'?window._eskAnswers:window._ksAnswers;
  if(answers){answers[qIdx]=val;}
  const tpl=D.template();
  const src=prefix==='esk-lk-'?window._eskAnswers:window._ksAnswers;
  if(src){
    const sc=calcSurveyScore(src,tpl.questions);const rk=calcRisk(sc);
    const previewId=prefix==='esk-lk-'?'esk-preview':'ks-score-preview';
    const pr=document.getElementById(previewId);
    if(pr)pr.innerHTML=`${prefix==='esk-lk-'?'Điểm mới:':'Điểm tạm tính:'} <strong style="font-size:17px;color:${scC(sc)}">${sc.toFixed(2)}/5.0</strong> — <span class="${rCls(rk)} risk">${rLb(rk)}</span>`;
  }
}

function saveSurvey(){
  const sid=document.getElementById('ks-s').value;
  const site=D.sites().find(s=>s.id===sid);
  const tpl=D.template();
  const answers=window._ksAnswers||[];
  if(answers.some(a=>a===0)){showToast('Vui lòng chọn điểm cho tất cả 11 tiêu chí!','error');return;}
  const score=calcSurveyScore(answers,tpl.questions);
  const risk=calcRisk(score);
  const id='KS'+String(Date.now()).slice(-5);
  const surveys=D.surveys();
  surveys.unshift({id,siteId:sid,cid:site?.cid,evaluator:document.getElementById('ks-e').value,position:document.getElementById('ks-ep').value,period:document.getElementById('ks-p').value,date:document.getElementById('ks-d').value,answers,score:+score.toFixed(2),risk});
  D.save('surveys',surveys);
  CM();renderContent();
}

  const tpl=D.template();
  openModal(`<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px"><div class="mt">${sNm(s.siteId)}</div><div style="text-align:right"><div style="font-family:var(--mono);font-weight:800;font-size:22px;color:${scC(s.score)}">${s.score.toFixed(2)}/5.0</div><span class="${rCls(s.risk)} risk">${rLb(s.risk)}</span></div></div>

    <div style="background:var(--bg);border-radius:var(--r);padding:12px;max-height:320px;overflow-y:auto">

function updateSurvey(id){
  const surveys=D.surveys();const idx=surveys.findIndex(x=>x.id===id);if(idx<0)return;

function saveIncident(){
  const what=document.getElementById('i-what').value.trim();if(!what){showToast(t('msg_required'),'error');return;}
  const sid=document.getElementById('i-s').value;
  const site=D.sites().find(s=>s.id===sid);
  const id='SC'+String(Date.now()).slice(-5);
  const action=(document.getElementById('i-action')?.value||'').trim();
  const incs=D.incidents();
  incs.unshift({id,siteId:sid,areaId:site?.areaId||'',cid:site?.cid||'',
    type:document.getElementById('i-t').value,
    sev:+document.getElementById('i-sev').value,status:'open',what,
    why:document.getElementById('i-why')?.value||'',
    who:document.getElementById('i-who')?.value||'',
    when:document.getElementById('i-when')?.value||today()+' 00:00',
    where:document.getElementById('i-where')?.value||'',
    how:document.getElementById('i-how')?.value||'',
    createdBy:CU.name,createdAt:today(),
    actions:action?[{id:'AC'+Date.now(),desc:action,
      resp:document.getElementById('i-resp')?.value||'',
      deadline:document.getElementById('i-dl')?.value||today(),status:'open'}]:[]
  });
  D.save('incidents',incs);CM();
  showToast('Đã ghi nhận sự kiện thành công!');
  renderSidebar();renderNP();renderContent();
}

function showToast(msg,type='success'){
  const old=document.getElementById('_toast');if(old)old.remove();
  const el=document.createElement('div');el.id='_toast';
  el.className='toast toast-'+(type==='success'?'s':type==='error'?'e':'a');
  el.innerHTML=`<span>${type==='success'?'✓':type==='error'?'✕':'⚠'}</span><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.animation='fadeOut .4s ease forwards';},2600);
  setTimeout(()=>{el.remove();},3100);
}

    <div class="mt">📥 ${t('btn_import')}</div>
    <div class="ms">Hỗ trợ định dạng .xlsx · .xls · .csv — Dữ liệu sẽ được thêm vào, không ghi đè</div>
    <div style="display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap">
      ${Object.entries(SCHEMAS).map(([k,v])=>`<button class="btn btn-sm" id="imp-tab-${k}" style="border-color:${k===type?'var(--blue)':'var(--bdr)'};background:${k===type?'var(--blue-l)':'#fff'};color:${k===type?'var(--blue)':'var(--t2)'}" onclick="switchImpTab('${k}')">${v.icon} ${v.label}</button>`).join('')}
    </div>
    <div id="imp-body"><!-- filled by switchImpTab --></div>
    <div id="imp-preview" style="display:none;margin-bottom:12px">
      <div style="font-size:11.5px;font-weight:700;color:var(--t2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px">Xem trước (5 dòng đầu)</div>
      <div id="imp-table" style="overflow-x:auto;max-height:200px;overflow-y:auto;border:1px solid var(--bdr);border-radius:var(--r)"></div>
      <div id="imp-count" style="margin-top:6px;font-size:12.5px;font-weight:700;color:var(--grn)"></div>
    </div>
    <div class="ma">
      <button class="btn btn-gh" onclick="CM()">${t('btn_cancel')}</button>
      <button class="btn btn-pr" id="imp-ok" onclick="confirmImport()" disabled style="opacity:.4">✓ Nhập ${SCHEMAS[type]?.label||''}</button>
    </div>
  `);
  switchImpTab(type);
  _impRows=null;_impType=type;
}

let _impType='surveys';
function switchImpTab(type){
  _impType=type;_impRows=null;
  // Update tab styles
  Object.keys(SCHEMAS).forEach(k=>{
    const btn=document.getElementById('imp-tab-'+k);
    if(btn){btn.style.borderColor=k===type?'var(--blue)':'var(--bdr)';btn.style.background=k===type?'var(--blue-l)':'#fff';btn.style.color=k===type?'var(--blue)':'var(--t2)';}
  });
  const sc=SCHEMAS[type];
  const body=document.getElementById('imp-body');
  if(!body)return;
  body.innerHTML=`
    <div style="background:var(--bg);border-radius:var(--r);padding:11px;margin-bottom:12px">
      <div style="font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:7px">📋 Cấu trúc cột cần có trong file Excel:</div>
      <div style="margin-bottom:7px">${sc.cols.map((c,i)=>`<span class="imp-col">${c}</span>`).join('')}</div>
      <div style="font-size:11px;color:var(--t2)">${sc.labels.join('  |  ')}</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <button class="btn btn-ob btn-sm" onclick="downloadTpl('${type}')">📋 Tải file mẫu Excel</button>
      <span style="font-size:11.5px;color:var(--t2)">→ Điền dữ liệu vào mẫu rồi upload lên bên dưới</span>
    </div>
    <div class="fg">
      <label class="fl">Chọn file Excel / CSV *</label>
      <input type="file" accept=".xlsx,.xls,.csv" id="imp-file"
        style="width:100%;padding:10px;background:var(--bg);border:2px dashed var(--bdr);border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--t1)"
        onchange="handleImpFile(this,'${type}')">
    </div>
  `;
  document.getElementById('imp-preview').style.display='none';
  const ok=document.getElementById('imp-ok');if(ok){ok.disabled=true;ok.style.opacity='.4';ok.textContent='✓ Nhập '+sc.label;}
}

function downloadTpl(type){
  if(!window.XLSX){showToast('SheetJS chưa tải xong','warn');return;}
  const sc=SCHEMAS[type];
  const wb=XLSX.utils.book_new();
  const data=[sc.cols,sc.labels,sc.sample,...Array(5).fill(Array(sc.cols.length).fill(''))];
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=sc.cols.map(()=>({wch:22}));
  // Style note row
  XLSX.utils.book_append_sheet(wb,ws,sc.label);
  XLSX.writeFile(wb,'mau_nhap_'+type+'_alsok.xlsx');
  showToast('Đã tải mẫu Excel cho '+sc.label);
}

function handleImpFile(input,type){
  const file=input.files[0];if(!file)return;
  if(!window.XLSX){showToast('SheetJS chưa tải, thử lại sau','error');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(raw.length<2){showToast('File không có dữ liệu!','error');return;}
      const sc=SCHEMAS[type];
      // Use first row as headers, normalize
      const hdrs=raw[0].map(h=>String(h).trim().toLowerCase().replace(/\s+/g,'_').replace(/[()\/]/g,''));
      const rows=raw.slice(1).filter(r=>r.some(c=>c!=='')).map(row=>{
        const obj={};
        // Try to match by column index (schema cols order) or header name
        sc.cols.forEach((col,ci)=>{
          const hiByName=hdrs.indexOf(col);
          obj[col]=hiByName>=0?String(row[hiByName]||'').trim():String(row[ci]||'').trim();
        });
        return obj;
      });
      _impRows=rows;
      // Show preview
      const previewCols=sc.cols.slice(0,7);
      const tbl=`<table class="preview-tbl"><thead><tr>${previewCols.map(c=>`<th>${c}</th>`).join('')}${sc.cols.length>7?`<th style="color:var(--t3)">+${sc.cols.length-7}</th>`:''}</tr></thead><tbody>${rows.slice(0,5).map(r=>`<tr>${previewCols.map(c=>`<td>${String(r[c]||'').substring(0,24)}</td>`).join('')}${sc.cols.length>7?'<td>...</td>':''}</tr>`).join('')}</tbody></table>`;
      document.getElementById('imp-table').innerHTML=tbl;
      document.getElementById('imp-count').textContent=`✓ Đọc được ${rows.length} dòng từ "${file.name}"`;
      document.getElementById('imp-preview').style.display='block';
      const ok=document.getElementById('imp-ok');if(ok){ok.disabled=false;ok.style.opacity='1';}
    }catch(err){showToast('Lỗi đọc file: '+err.message,'error');}
  };
  reader.readAsArrayBuffer(file);
}

function confirmImport(){
  if(!_impRows||!_impRows.length){showToast('Không có dữ liệu!','error');return;}
  const sc=SCHEMAS[_impType];if(!sc)return;
  try{
    const n=sc.process(_impRows);
    CM();showToast(`✓ Đã nhập ${n} ${sc.label} thành công!`);
    renderSidebar();renderNP();renderContent();
  }catch(err){showToast('Lỗi nhập: '+err.message,'error');}
}

// ═══════════════════════════════════════════════════════════════
// EXCEL EXPORT SYSTEM
// ═══════════════════════════════════════════════════════════════
function exportExcel(type){
  if(!window.XLSX){showToast('SheetJS đang tải, thử lại sau','warn');return;}
  const wb=XLSX.utils.book_new();
  const addSheet=(name,data)=>{const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=data[0].map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,name);};

  if(!type||type==='all'||type==='surveys'){
    const tpl=D.template();
    const qH=tpl.questions.map((q,i)=>`Q${String(i+1).padStart(2,'0')}: ${q.text.substring(0,15)}`);
    addSheet('Khảo sát CL',[
      ['Mã KS','Mục tiêu','Khách hàng','Người ĐG','Chức vụ','Kỳ','Ngày','Điểm','Rủi ro',...qH],
      ...D.surveys().map(s=>[s.id,sNm(s.siteId),cNm(s.cid),s.evaluator,s.position||'',s.period,s.date,s.score,rLb(s.risk),...s.answers])
    ]);
  }
  if(!type||type==='all'||type==='incidents'){
    addSheet('Sự kiện 5W1H',[
      ['Mã SC','Loại','Mục tiêu','KH','Mức độ','TT','WHAT','WHY','WHO','WHEN','WHERE','HOW','Ngày tạo','Số ĐS'],
      ...D.incidents().map(i=>[i.id,i.type,sNm(i.siteId),cNm(i.cid),i.sev,i.status,i.what,i.why,i.who,i.when,i.where,i.how,i.createdAt,i.actions.length])
    ]);
  }
  if(!type||type==='all'||type==='alarms'){
    addSheet('Báo động',[
      ['Mã AL','Loại','Mục tiêu','KH','Báo nhầm','TG bắt đầu','TG nhận','MTTA(phút)','TG phục hồi','MTTR(phút)','Nguyên nhân','TT'],
      ...D.alarms().map(a=>[a.id,a.type,sNm(a.siteId),cNm(a.cid),a.falseAlarm?'Có':'Không',a.startTime,a.receiveTime,calcTime(a.startTime,a.receiveTime)||'',a.recoveryTime,calcTime(a.startTime,a.recoveryTime)||'',a.cause,a.status])
    ]);
  }
  if(!type||type==='all'||type==='guards'){
    addSheet('Bảo vệ',[
      ['Mã NV','Họ tên','Chức danh','Mục tiêu','Khách hàng','Ca trực','Điện thoại','Ngày vào','Chứng chỉ','TT'],
      ...D.guards().map(g=>{const site=D.sites().find(s=>s.id===g.siteId);return[g.id,g.name,g.title,sNm(g.siteId),site?cNm(site.cid):'—',g.shift,g.phone,g.joined,g.cert?'Có':'Chưa',g.status];})
    ]);
  }
  if(!type||type==='all'||type==='dispatches'){
    addSheet('Điều động QRT',[
      ['Mã DC','Đội QRT','Báo động','TG xuất phát','TG đến nơi','TG hoàn tất','T.gian đến(phút)','Kết quả'],
      ...D.dispatches().map(dc=>[dc.id,dc.teamId,dc.alarmId||'—',dc.dispatchTime,dc.arrivalTime,dc.finishTime,calcTime(dc.dispatchTime,dc.arrivalTime)||'',dc.result])
    ]);
  }
  if(!type||type==='all'||type==='companies'){
    addSheet('Khách hàng',[
      ['Mã KH','Tên KH','Loại DV','SLA','Người LH','Điện thoại','Email','Khu vực'],
      ...D.companies().map(c=>[c.id,c.name,c.type,c.sla,c.contact,c.phone,c.email||'',aNm(c.areaId)])
    ]);
    addSheet('Mục tiêu',[
      ['Mã MT','Tên mục tiêu','Mã KH','Loại DV','Khu vực','Địa chỉ','Vĩ độ','Kinh độ'],
      ...D.sites().map(s=>[s.id,s.name,s.cid,s.type,aNm(s.areaId),s.addr,s.lat,s.lng])
    ]);
  }
  XLSX.writeFile(wb,'alsok-vss-export-'+today()+'.xlsx');
  showToast('✓ Xuất Excel thành công!');
}

function openExportMenu(){
  openModal(`<div class="mt">📊 Xuất dữ liệu ra Excel</div><div class="ms">Chọn loại dữ liệu cần xuất</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
      ${[['all','🗂️ Tất cả dữ liệu (full export)'],['surveys','⭐ Khảo sát Chất lượng'],['incidents','⚠️ Sự kiện 5W1H'],['alarms','🔔 Báo động'],['guards','👮 Bảo vệ nhân sự'],['dispatches','⚡ Điều động QRT'],['companies','🏢 KH & Mục tiêu']].map(([k,l])=>`
        <button class="btn btn-ob" style="justify-content:flex-start;text-align:left" onclick="exportExcel('${k}');CM()">${l}</button>`).join('')}
    </div>
    <div class="ma"><button class="btn btn-gh" onclick="CM()">Đóng</button></div>`);
}
